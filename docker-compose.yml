services:
  backend:
    build:
      context: ./backend
    container_name: greenwind-backend
    restart: unless-stopped
    environment:
      APP_NAME: 绿风环境花卉 ERP
      APP_SECRET: change-this-secret-before-company-test
      DATABASE_URL: sqlite:////data/greenwind.db
      FRONTEND_ORIGIN: http://localhost:5173
    volumes:
      - ./data:/data
    ports:
      - "8010:8010"

  frontend:
    build:
      context: ./frontend
    container_name: greenwind-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:5173"
