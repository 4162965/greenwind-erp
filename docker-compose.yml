services:
  backend:
    build:
      context: ./backend
    container_name: greenwind-backend
    restart: unless-stopped
    environment:
      APP_NAME: 绿风环境花卉 ERP
      APP_SECRET: greenwind-change-this-secret
      DATABASE_URL: sqlite:////data/greenwind.db
      FRONTEND_ORIGIN: http://175.178.106.253:5173
      FRONTEND_ORIGINS: http://localhost:5173,http://127.0.0.1:5173,http://192.168.31.154:5173,http://175.178.106.253:5173
    volumes:
      - ./data:/data
    ports:
      - "8010:8010"
    command: >
      sh -c "
      python -m app.seed &&
      uvicorn app.main:app --host 0.0.0.0 --port 8010
      "

  frontend:
    build:
      context: ./frontend
    container_name: greenwind-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:5173"
